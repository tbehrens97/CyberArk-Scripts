name: Build PSMSAPHANAStudioDispatcher

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Check CyberArk dependencies
      working-directory: CyberArkPSMHanaDispatcher
      shell: pwsh
      run: |
        $required = @(
          'vendor/PSMDispatcherUtilsManaged.dll',
          'vendor/PSMDispatcherUtils.dll',
          'vendor/PSMGenericClientDriver.dll'
        )
        $missing = $required | Where-Object { -not (Test-Path $_) }
        if ($missing) {
          Write-Error "Missing CyberArk dependencies: $($missing -join ', '). Provide them before running this workflow."
        }

    - name: Restore
      working-directory: CyberArkPSMHanaDispatcher
      run: dotnet restore CyberArkHanaDispatcher.csproj

    - name: Publish
      working-directory: CyberArkPSMHanaDispatcher
      run: |
        dotnet publish CyberArkHanaDispatcher.csproj `
          --configuration Release `
          --runtime win-x64 `
          --self-contained true `
          --output publish

    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: PSMSAPHANAStudioDispatcher
        path: CyberArkPSMHanaDispatcher/publish/